    LAYER_ORDER=['imageLayer','densityOverviewLayer','dataPointLayer','hexagonLayer','boundaryLayer','labelLayer'];function getLayerIndex(object){const idx=LAYER_ORDER.indexOf(object.id);if(idx!==-1)return idx;for(let i=0;i<LAYER_ORDER.length;i++){if(object.id.startsWith(LAYER_ORDER[i]))return i;}
return-1;}
class WidgetRegistry{constructor(){this.widgets=new Map();this.eventHandlers=new Map();}

unregister(widgetId){const widget=this.widgets.get(widgetId);if(widget){this.widgets.delete(widgetId);this.emit('widget-unregistered',{widgetId,widget});}}

getWidgetIds(){return Array.from(this.widgets.keys());}
on(eventName,handler){if(!this.eventHandlers.has(eventName)){this.eventHandlers.set(eventName,new Set());}

once(eventName,handler){const wrappedHandler=(data)=>{this.off(eventName,wrappedHandler);handler(data);};this.on(eventName,wrappedHandler);}
off(eventName,handler){const handlers=this.eventHandlers.get(eventName);if(handlers){handlers.delete(handler);}}
emit(eventName,data={}){const handlers=this.eventHandlers.get(eventName);if(handlers){handlers.forEach(handler=>{try{handler(data);}catch(error){console.error(`Error in widget event handler for "${eventName}":`,error);}});}}

clear(){this.widgets.clear();this.eventHandlers.clear();}}
function isFontLoaded(fontName){return document.fonts.check(`12px "${fontName}"`);}
function waitForFont(fontName,maxWait=500){return new Promise((resolve,reject)=>{if(isFontLoaded(fontName)){resolve();}else{const startTime=Date.now();const interval=setInterval(()=>{if(isFontLoaded(fontName)){clearInterval(interval);resolve();}else if(Date.now()-startTime>maxWait){clearInterval(interval);reject(new Error(`Font ${fontName} did not load within ${maxWait}ms`));}},50);}});}
function getInitialViewportSize(){const width=document.documentElement.clientWidth;const height=document.documentElement.clientHeight;return{viewportWidth:width,viewportHeight:height};}
function calculateZoomLevel(bounds,viewportWidth,viewportHeight,padding=0.5){const lngRange=bounds[1]-bounds[0];const latRange=bounds[3]-bounds[2];const centerLng=(bounds[0]+bounds[1])/2;const centerLat=(bounds[2]+bounds[3])/2;const zoomX=Math.log2(360/(lngRange/(viewportWidth/256)));const zoomY=Math.log2(180/(latRange/(viewportHeight/256)));const zoom=Math.min(zoomX,zoomY)-padding;return{zoomLevel:zoom,dataCenter:[centerLng,centerLat]};}
class DataMap{constructor({container,bounds,searchItemId="text-search",lassoSelectionItemId="lasso-selection",}){this.container=container;this.searchItemId=searchItemId;this.lassoSelectionItemId=lassoSelectionItemId;this.pointData=null;this.labelData=null;this.metaData=null;this.layers=[];const{viewportWidth,viewportHeight}=getInitialViewportSize();const{zoomLevel,dataCenter}=calculateZoomLevel(bounds,viewportWidth,viewportHeight);this.deckgl=new deck.DeckGL({container:container,initialViewState:{latitude:dataCenter[1],longitude:dataCenter[0],zoom:zoomLevel},controller:{scrollZoom:{speed:0.01,smooth:true}},});this.updateTriggerCounter=0;this.dataSelectionManager=new DataSelectionManager(lassoSelectionItemId);this.widgetRegistry=new WidgetRegistry();this._viewStateListeners=new Map();this.deckgl.setProps({onViewStateChange:(params)=>{for(const handler of this._viewStateListeners.values()){try{handler(params);}catch(e){console.error('Error in viewStateChange listener:',e);}}

function mergeTypedArrays(arrays) {
  let totalLength = arrays.reduce((acc, arr) => acc + arr.length, 0);
  let result = new arrays[0].constructor(totalLength);
  let currentLength = 0;
  for (let arr of arrays) {
    result.set(arr, currentLength);
    currentLength += arr.length;
  }
  return result;
}

    combinedTable[key] = mergeTypedArrays(arrays);

  return combinedTable;

        }

        const decompressedData = new Uint8Array(totalSize);
        let offset = 0;
        for (const chunk of chunks) {
          decompressedData.set(chunk, offset);
          offset += chunk.length;
        }

        return decompressedData;
      } catch (error) {

        throw error;
      }

async function resolveDensityTileImages(tilePyramids) {
  // When running inside a Jupyter notebook with file-based data, image URLs
  // point at the Jupyter contents API which returns JSON with base64 content
  // instead of raw image bytes.  Detect this and convert to blob URLs so that
  // deck.gl BitmapLayer can consume them.
  const allTiles = [];
  for (const field of Object.keys(tilePyramids)) {
    for (const level of tilePyramids[field]) {
      for (const tile of level) {
        allTiles.push(tile);
      }
    }
  }
  if (allTiles.length === 0) return;

  // Only need special handling when the URL routes through /api/contents/
  const needsResolve = allTiles[0].image.includes('/api/contents/');
  if (!needsResolve) return;

  const headers = {};
  const densityApiToken = (typeof DENSITY_API_TOKEN !== 'undefined') ? DENSITY_API_TOKEN : null;
  if (densityApiToken) {
    headers['Authorization'] = 'Token ' + densityApiToken;
  }

  await Promise.all(allTiles.map(async (tile) => {
    try {
      const resp = await fetch(tile.image, { headers });
      if (!resp.ok) {
        console.error('Failed to fetch density tile:', tile.image, resp.status);
        return;
      }
      const json = await resp.json();
      const b64 = json.content;  // Jupyter contents API base64 field
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const blob = new Blob([bytes], { type: 'image/png' });
      tile.image = URL.createObjectURL(blob);
    } catch (e) {
      console.error('Error resolving density tile image:', e);
    }
  }));
}

// =============================================================================
// Label Data Loading
// =============================================================================

function loadLabelDataLayer() {
  const labelDataWorker = new Worker(workerUrl);
  labelDataWorker.postMessage({encodedData: labelDataEncoded, JSONParse: true});

  labelDataWorker.onmessage = async function(event) {
    if (event.data.type === "progress") {
      updateProgressBar('label-data-progress', event.data.progress);
    } else {
      const { data } = event.data;
      

  const parsedData = data[0].chunkData;


      const labelData = parsedData;
      
      datamap.labelData = labelData;
      
      datamap.addLabels(
        
        labelData
        ,
        {
          labelTextColor: d => [d.r, d.g, d.b],
          textMinPixelSize: 18,
          textMaxPixelSize: 36,
          textOutlineWidth: 8,
          textOutlineColor: [238, 238, 238, 221],
          textBackgroundColor: [255, 255, 255, 64],
          fontFamily: "IBM Plex Sans",
          fontWeight: 600,
          lineSpacing: 0.95,
          textCollisionSizeScale: 2,
          noiseLabel: "Unlabelled",
          pickable: false,
        }
      );

      
      
      
      
      // Dispatch event for widget initialization
      document.dispatchEvent(new CustomEvent('datamapLabelsLoaded', { detail: { labelData } }));
      
      document.getElementById("loading").style.display = "none";
      updateProgressBar('label-data-progress', 100);
      checkAllDataLoaded();
    }
  };
}



// =============================================================================
// Meta Data Loading
// =============================================================================

function loadMetaData() {
  const metaDataWorker = new Worker(workerUrl);
  metaDataWorker.postMessage({encodedData: hoverDataEncoded, JSONParse: true});

  metaDataWorker.onmessage = async function(event) {
    if (event.data.type === "progress") {
      updateProgressBar('meta-data-progress', event.data.progress);
    } else {
      const { data } = event.data;
      

  const parsedData = combineTableChunks(data);


      const hoverData = parsedData;
      
      datamap.addMetaData(hoverData, {
        tooltipFunction: ({index, picked, layer}) => picked ? {"html": `
<div style="max-width: 340px; white-space: normal; font-weight: 400; color: #1f2328;">
  <span style="display: inline-block; padding: 1px 8px; margin-bottom: 5px;
    border-radius: 999px; font-size: 11px; font-weight: 600;
    background: ${hoverData.pill_bg[index]}; color: ${hoverData.pill_fg[index]};">${hoverData.domain[index]}</span>
  <div style="font-weight: 600; font-size: 15px; line-height: 1.25;
    overflow-wrap: anywhere;">${hoverData.title[index]}</div>

`} : null,
