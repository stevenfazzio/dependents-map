[project]
name = "dependents-map"
version = "0.1.0"
description = "Data maps of the projects that depend on a given package, built from their READMEs"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=1.8",
    "beautifulsoup4>=4.12",
    "datamapplot>=0.7.3",
    "glasbey>=0.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2",
    "pandas>=2.2,<3",
    "pillow>=11",
    "playwright>=1.63",
    "pyarrow>=17",
    "requests>=2.32",
    "tokenizers>=0.20",
    "toponymy>=0.5.4",
    "umap-learn>=0.5.10",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
